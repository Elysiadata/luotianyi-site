# ==========================================================================
# Cloudflare Workers 部署配置
# --------------------------------------------------------------------------
# 这个文件不是网站内容，是给 Cloudflare 看的「说明书」。
# 它告诉 Cloudflare：把仓库根目录（./）整个当作静态网站发布出去。
#
# 没有这个文件，Cloudflare 的 npx wrangler deploy 就不知道要部署什么，
# 构建会失败。
#
# 放在仓库根目录，和 index.html 同一层。
# ==========================================================================

name = "luotianyi-site"

# 运行时版本标记，写一个过去的日期即可，不需要改
compatibility_date = "2025-06-05"

# 关键配置：把仓库根目录作为静态资源目录
# 注意：本站只有静态文件、没有 Worker 脚本，
#       所以这里不需要 binding 字段
[assets]
directory = "./"
